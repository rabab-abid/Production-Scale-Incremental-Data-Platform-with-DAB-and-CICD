resources:
  jobs:
    allnotebooks_pipeline_job:
      name: allnotebooks_pipeline_job_dab
      tasks:
        - task_key: silver_autoloader_ingest
          notebook_task:
            notebook_path: ../src/silver/silver_autoloader_ingest.py
            base_parameters:
              catalog_name: ${var.my_catalog}

        - task_key: jinja_transform
          depends_on:
            - task_key: silver_autoloader_ingest
          notebook_task:
            notebook_path: ../jinja/jinja.py
            base_parameters:
              catalog_name: ${var.my_catalog}
          
        - task_key: gold_pipeline_run
          depends_on:
            - task_key: silver_autoloader_ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}

      queue:
        enabled: true